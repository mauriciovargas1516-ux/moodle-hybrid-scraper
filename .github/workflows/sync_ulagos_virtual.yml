name: Robot Sincronizador ULagos Virtual

on:
  schedule:
    # Corre todos los días a las 08:00 y 20:00 hora de Chile (11:00 y 23:00 UTC)
    - cron: "0 11,23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sincronizar-moodle:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 selenium urllib3

      - name: Ejecutar Robot Moodle -> GitHub
        env:
          MOODLE_USER: ${{ secrets.MOODLE_USER }}
          MOODLE_PASS: ${{ secrets.MOODLE_PASS }}
          MOODLE_DOMAIN: "@alumnos.ulagos.cl"
          GH_PAT_SYNC: ${{ secrets.GH_PAT_SYNC }}
          GH_OWNER: "mauriciovargas1516-ux"
          CARPETA_DESTINO_REPO: "apuntes_moodle"
        run: python sync_headless_github.py

      - name: Guardar registro de última sincronización
        if: always()
        run: |
          git config user.name "Robot Moodle ULagos"
          git config user.email "actions@github.com"
          git add ultimo_sync.json
          git diff --staged --quiet || git commit -m "Robot Moodle: actualizar estado ultimo_sync.json"
          git push
